<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CropSense AI{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
  <div class="container-xl">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <i class="fas fa-seedling fa-lg text-success"></i>
      <span class="fw-bold fs-5">CropSense <span class="text-success">AI</span></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/"><i class="fas fa-home me-1"></i>Home</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/predict' %}active{% endif %}" href="/predict"><i class="fas fa-brain me-1"></i>Predict Crop</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard"><i class="fas fa-chart-line me-1"></i>Dashboard</a></li>
      </ul>
    </div>
  </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<footer class="footer-bar text-center py-3 mt-5">
  <p class="mb-0 text-muted small">
    <i class="fas fa-leaf text-success me-1"></i>
    CropSense AI &mdash; Ensemble ML for Climate-Resilient Agriculture &mdash; Karnataka, India
  </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
